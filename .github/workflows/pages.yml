name: Docs

on:
  push:
    branches: [main]
  pull_request:
  # The regenerated demo build and screenshots land in a [skip ci] commit, so the site is built again after them.
  workflow_run:
    workflows: [Regenerate demo and screenshots]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Builds the site from docs/ with the X-Libs site framework, with the face builder and its fresh build beside it.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || '' }}
          # The whole history, so each page shows the date of its last commit.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install && npm run dist
      - run: npm ci && npm run build
        working-directory: docs
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: docs/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
